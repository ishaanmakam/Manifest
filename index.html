<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manifest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Serif:wght@400&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F4F5F7;--card:#FFFFFF;--ink:#1B2130;--ink-2:#5C6472;--ink-3:#8A919E;--line:#DDE2E8;--line-2:#EEF1F4;--focus:#2A5BD7;
    --go:#1E7F4F;--go-bg:#DDF1E5;--wait:#2A5BD7;--wait-bg:#DCE6FA;--int:#6D3FC7;--int-bg:#E9E0F8;--hold:#9A6B00;--hold-bg:#F6ECCF;
    --scrub:#6B7280;--scrub-bg:#E8EBEF;--done:#0E7C86;--done-bg:#D6EEF0;--no:#B23A32;--no-bg:#F6DCD9;--r:6px;
  }
  *{box-sizing:border-box}
  html{background:var(--paper);color:var(--ink);font:15px/1.55 "IBM Plex Sans",system-ui,sans-serif}
  body{margin:0;min-height:100vh}
  a{color:var(--focus)}
  button,input,select,textarea{font:inherit;color:var(--ink)}
  button{border:1px solid var(--line);background:var(--card);padding:6px 12px;border-radius:var(--r);cursor:pointer;font-size:14px;white-space:nowrap}
  button:hover{border-color:#C5CCD5}
  button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
  button.primary:hover{background:#2A3142}
  button.quiet{border-color:transparent;background:transparent;color:var(--ink-2)}
  button.quiet:hover{background:var(--line-2)}
  button.danger{color:var(--no)}
  button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
  :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  .hidden{display:none!important}

  .bar{position:sticky;top:0;z-index:5;background:rgba(244,245,247,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
  .bar-in{max-width:1240px;margin:auto;padding:10px 20px;display:flex;align-items:center;gap:10px}
  .brand{font-weight:600;font-size:18px;letter-spacing:-.01em;margin-right:6px}
  .bar input[type=search]{flex:1;min-width:160px;max-width:420px;border:1px solid var(--line);border-radius:var(--r);padding:7px 10px;background:var(--card)}
  .bar .grow{flex:1}
  .bar .who{color:var(--ink-3);font-size:13px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .seg button{border:0;border-radius:0;padding:6px 10px}
  .seg button+button{border-left:1px solid var(--line)}

  /* auth */
  .auth{max-width:380px;margin:80px auto;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:28px}
  .auth h1{margin:0 0 4px;font-size:26px;font-weight:600}.auth p{margin:0 0 18px;color:var(--ink-2);font-size:14px}
  .auth label{display:block;font-size:13px;color:var(--ink-2);margin:12px 0 4px}
  .auth input{width:100%;border:1px solid var(--line);border-radius:var(--r);padding:8px 10px}
  .auth .row{display:flex;gap:8px;margin-top:18px}.auth .row button{flex:1}
  .auth .err{color:var(--no);font-size:13px;margin-top:10px;min-height:18px}.auth .demo{margin-top:14px;font-size:13px;color:var(--ink-3)}

  /* split layout */
  .wrap{max-width:1240px;margin:auto;padding:18px 20px 80px;display:grid;grid-template-columns:380px 1fr;gap:18px;align-items:start}
  .wrap.doc{display:block}
  .side{position:sticky;top:62px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 10px;font-size:12.5px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
  .chip b{font-weight:600}.chip .dot{width:7px;height:7px;border-radius:50%;display:inline-block}
  .chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .listhead{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:13px;color:var(--ink-3)}
  .listhead select{margin-left:auto;border:1px solid var(--line);border-radius:var(--r);padding:4px 8px;background:var(--card);font-size:13px}
  .list{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:calc(100vh - 190px)}
  .item{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:11px 14px;border-bottom:1px solid var(--line-2);cursor:pointer}
  .item:last-child{border-bottom:0}
  .item:hover{background:#FAFBFC}
  .item.sel{background:#F0F3F8;box-shadow:inset 3px 0 0 var(--ink)}
  .item .org{font-weight:500}
  .item .meta{grid-column:1/-1;color:var(--ink-3);font-size:12.5px;display:flex;gap:10px;flex-wrap:wrap}
  .item .meta .soon{color:var(--hold);font-weight:500}
  .pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:500;white-space:nowrap;align-self:start}
  .s-go{background-color:var(--go-bg);color:var(--go)}.s-wait{background-color:var(--wait-bg);color:var(--wait)}.s-int{background-color:var(--int-bg);color:var(--int)}
  .s-hold{background-color:var(--hold-bg);color:var(--hold)}.s-scrub{background-color:var(--scrub-bg);color:var(--scrub)}.s-done{background-color:var(--done-bg);color:var(--done)}.s-no{background-color:var(--no-bg);color:var(--no)}
  .empty{padding:36px 20px;text-align:center;color:var(--ink-3);font-size:14px}

  /* detail */
  .detail{background:var(--card);border:1px solid var(--line);border-radius:10px;min-height:300px}
  .d-head{display:flex;gap:10px;align-items:center;padding:16px 22px;border-bottom:1px solid var(--line)}
  .d-head h2{margin:0;font-size:20px;font-weight:600;flex:1;min-width:0}
  .d-head .role{margin:2px 0 0;color:var(--ink-2);font-size:14px;font-weight:400}
  select.status{border:1px solid transparent;border-radius:999px;padding:3px 26px 3px 10px;font-size:13px;font-weight:500;cursor:pointer;appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' fill='none' stroke='%23555' stroke-width='1.5'/></svg>");background-repeat:no-repeat;background-position:right 9px center}
  .d-body{padding:18px 22px 28px}
  dl{display:grid;grid-template-columns:140px 1fr;gap:5px 16px;margin:0 0 6px;font-size:14px}
  dt{color:var(--ink-2)}dd{margin:0;white-space:pre-wrap}
  .sec{margin-top:18px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);display:flex;align-items:center;gap:10px}
  .sec .line{flex:1;height:1px;background:var(--line-2)}
  .q{padding:14px 0 4px}
  .q h3{font-size:15px;font-weight:600;margin:0 0 4px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
  .q .tag{font-weight:400;color:var(--ink-3);font-size:12.5px}
  .q .note{margin:0 0 6px;color:var(--ink-2);font-size:14px;white-space:pre-wrap}
  .essay{font-family:"IBM Plex Serif",Georgia,serif;font-size:15px;line-height:1.7;background:var(--paper);border:1px solid var(--line);padding:16px 18px;margin:6px 0 0;border-radius:var(--r);white-space:pre-wrap}
  .essay.clamp{max-height:9.5em;overflow:hidden;position:relative}
  .essay.clamp::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3em;background:linear-gradient(transparent,var(--paper))}
  .qbar{display:flex;gap:10px;align-items:center;margin-top:6px;font-size:12.5px;color:var(--ink-3)}
  .qbar button{font-size:12.5px;padding:2px 8px}
  .none{color:var(--ink-3);font-size:14px;margin:12px 0 0}
  .placeholder{padding:60px 20px;text-align:center;color:var(--ink-3)}

  /* document view */
  .docapp{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:14px}

  /* editor */
  .ed label{display:block;font-size:13px;color:var(--ink-2);margin:12px 0 4px}
  .ed input,.ed select,.ed textarea{width:100%;border:1px solid var(--line);border-radius:var(--r);padding:7px 10px;background:var(--card)}
  .ed textarea{min-height:76px;resize:vertical}
  .ed textarea.long{min-height:220px;font-family:"IBM Plex Serif",Georgia,serif;line-height:1.6}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
  .qe{border:1px solid var(--line);border-radius:var(--r);padding:4px 14px 14px;margin-top:14px;background:#FAFBFC}
  .qe .qrow{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
  .ed .foot{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap;align-items:center}.ed .foot .grow{flex:1}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
  .toast.show{opacity:1}

  @media (max-width:860px){
    .wrap{grid-template-columns:1fr}.side{position:static}.list{max-height:none}
    .bar input[type=search]{max-width:none}.bar .who{display:none}
    dl,.g2{grid-template-columns:1fr}dt{margin-top:8px}
  }
</style>
</head>
<body>

<div class="bar"><div class="bar-in">
  <span class="brand">Manifest</span>
  <input type="search" id="search" placeholder="Search organizations, roles, prompts…" aria-label="Search" class="hidden">
  <span class="grow"></span>
  <span id="viewseg" class="seg hidden"><button id="v-split" aria-pressed="true" title="List with details">Split</button><button id="v-doc" aria-pressed="false" title="Everything on one page">Document</button></span>
  <button class="primary hidden" id="btn-add">Add application</button>
  <span class="who" id="who"></span>
  <button class="quiet hidden" id="btn-import">Import</button><input type="file" id="file-import" accept="application/json" hidden>
  <button class="quiet hidden" id="btn-export">Export</button>
  <button class="quiet hidden" id="btn-signout">Sign out</button>
</div></div>

<section class="auth" id="auth">
  <h1>Sign in</h1>
  <p>Your applications, prompts, and essays in one place. Only you can see them.</p>
  <label for="email">Email</label><input id="email" type="email" autocomplete="email" placeholder="you@school.edu">
  <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" placeholder="at least 8 characters">
  <div class="row"><button class="primary" id="btn-signin">Sign in</button><button id="btn-signup">Create account</button></div>
  <div class="err" id="auth-err"></div><div class="demo" id="demo-note"></div>
</section>

<div class="wrap hidden" id="app">
  <div class="side" id="side">
    <div class="chips" id="chips"></div>
    <div class="listhead"><span id="count"></span>
      <select id="sort" aria-label="Sort"><option value="pos">Newest first</option><option value="deadline">Deadline</option><option value="org">A–Z</option><option value="updated">Recently edited</option></select></div>
    <div class="list" id="list"></div>
  </div>
  <div id="main"></div>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
// ================= CONFIG =================
const SUPABASE_URL = "https://xtqwcpogbzmxxdiwapeg.supabase.co";        // e.g. "https://abcd1234.supabase.co"
const SUPABASE_ANON_KEY = "sb_publishable_QStH59XnYoAjJOOXevuoTQ_0nUDAoud";   // anon public key (safe to ship; RLS protects rows)
// ==========================================

const STATUSES = {go:"In progress",wait:"Submitted",int:"Interview",hold:"Deciding",scrub:"Set aside",done:"Offer",no:"Rejected"};
const COLORS   = {go:"var(--go)",wait:"var(--wait)",int:"var(--int)",hold:"var(--hold)",scrub:"var(--scrub)",done:"var(--done)",no:"var(--no)"};

const DEMO = !(SUPABASE_URL && SUPABASE_ANON_KEY);
const sb = DEMO ? null : supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let user = null, apps = [], filter = "all", query = "", sort = "pos", open = null, mode = "view";

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const words = s => (s||"").trim() ? s.trim().split(/\s+/).length : 0;
let toastT; function toast(t){ const el=$("#toast"); el.textContent=t; el.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("show"),1800); }

// ================= DATA LAYER =================
const store = {
  async list(){
    if(DEMO) return apps;
    const {data,error} = await sb.from("applications").select("*").order("position").order("created_at");
    if(error) throw error; return data;
  },
  async insert(a){
    if(DEMO){ a.id="d"+Math.random().toString(36).slice(2,8); a.updated_at=new Date().toISOString(); apps.unshift(a); return a; }
    const {data,error} = await sb.from("applications").insert(a).select().single();
    if(error) throw error; return data;
  },
  async update(id,patch){
    if(DEMO){ const a=apps.find(x=>x.id===id); Object.assign(a,patch,{updated_at:new Date().toISOString()}); return a; }
    const {data,error} = await sb.from("applications").update(patch).eq("id",id).select().single();
    if(error) throw error; return data;
  },
  async remove(id){
    if(DEMO){ apps=apps.filter(x=>x.id!==id); return; }
    const {error} = await sb.from("applications").delete().eq("id",id); if(error) throw error;
  }
};

// ================= AUTH =================
async function boot(){
  if(DEMO){
    $("#demo-note").textContent = "Demo mode: no database configured, so anything you add lives in this tab only. Use any email and password.";
    $("#btn-signin").onclick = $("#btn-signup").onclick = ()=>{ user={email:$("#email").value||"demo@local"}; enter(); };
    return;
  }
  const {data:{session}} = await sb.auth.getSession();
  if(session){ user=session.user; enter(); }
  sb.auth.onAuthStateChange((_e,s)=>{ if(s){ user=s.user; if($("#app").classList.contains("hidden")) enter(); } else { user=null; leave(); } });
  $("#btn-signin").onclick = async()=>{ const {error}=await sb.auth.signInWithPassword({email:$("#email").value.trim(),password:$("#pw").value}); $("#auth-err").textContent=error?error.message:""; };
  $("#btn-signup").onclick = async()=>{ const {data,error}=await sb.auth.signUp({email:$("#email").value.trim(),password:$("#pw").value}); $("#auth-err").textContent = error?error.message : (data.session?"":"Check your email to confirm, then sign in."); };
}
async function enter(){
  $("#auth").classList.add("hidden"); $("#app").classList.remove("hidden"); $("#who").textContent=user.email; setToolbar(true);
  try{ apps = await store.list(); }catch(e){ toast(e.message); }
  render();
}
function leave(){ apps=[]; open=null; $("#app").classList.add("hidden"); $("#auth").classList.remove("hidden"); $("#who").textContent=""; setToolbar(false); }
$("#btn-signout").onclick = async()=>{ if(DEMO){ user=null; leave(); return; } await sb.auth.signOut(); };

// ================= STATE / RENDER =================
let view = "split"; // or "doc"
function visible(){
  let v = apps.filter(a => filter==="all" || a.status===filter);
  if(query){ const q=query.toLowerCase(); v=v.filter(a => [a.org,a.role,a.term,...(a.notes||[]).flat(),...(a.questions||[]).map(x=>x.prompt+" "+x.tag+" "+x.answer)].join(" ").toLowerCase().includes(q)); }
  const by = { pos:(a,b)=>(a.position??0)-(b.position??0), deadline:(a,b)=>(a.deadline||"9999")<(b.deadline||"9999")?-1:1,
    org:(a,b)=>a.org.localeCompare(b.org), updated:(a,b)=>(b.updated_at||"")<(a.updated_at||"")?-1:1 }[sort];
  return [...v].sort(by);
}
function dueText(d){ if(!d) return ""; const days=Math.round((new Date(d)-new Date(new Date().toDateString()))/86400000);
  if(days<0) return `<span>due ${d}</span>`; if(days<=7) return `<span class="soon">due ${d} · ${days===0?"today":days+"d"}</span>`; return `<span>due ${d}</span>`; }
function statusSelect(a){ return `<select class="status s-${a.status}" data-id="${a.id}" aria-label="Status">${Object.entries(STATUSES).map(([k,v])=>`<option value="${k}" ${a.status===k?"selected":""}>${v}</option>`).join("")}</select>`; }
function setToolbar(on){ ["#search","#viewseg","#btn-add","#btn-import","#btn-export","#btn-signout"].forEach(s=>$(s).classList.toggle("hidden",!on)); }

function render(){
  const counts={}; apps.forEach(a=>counts[a.status]=(counts[a.status]||0)+1);
  $("#chips").innerHTML = `<button class="chip" data-f="all" aria-pressed="${filter==="all"}">All <b>${apps.length}</b></button>`+
    Object.entries(STATUSES).map(([k,v])=>`<button class="chip" data-f="${k}" aria-pressed="${filter===k}"><span class="dot" style="background:${COLORS[k]}"></span>${v} <b>${counts[k]||0}</b></button>`).join("");
  document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{filter=c.dataset.f;render();});
  const v=visible();
  $("#count").textContent = `${v.length} of ${apps.length}`;
  $("#app").classList.toggle("doc", view==="doc");
  $("#side").classList.toggle("hidden", view==="doc");
  if(view==="doc"){ renderDoc(v); return; }
  if(!v.length){ $("#list").innerHTML=`<div class="empty">${apps.length?"Nothing matches.":"No applications yet."}</div>`; }
  else $("#list").innerHTML = v.map(a=>`<div class="item ${a.id===open?"sel":""}" data-id="${a.id}" tabindex="0">
    <span class="org">${esc(a.org)}</span><span class="pill s-${a.status}">${STATUSES[a.status]}</span>
    <span class="meta">${a.role?`<span>${esc(a.role)}</span>`:""}${a.term?`<span>${esc(a.term)}</span>`:""}${dueText(a.deadline)}${(a.questions||[]).length?`<span>${a.questions.length} prompt${a.questions.length>1?"s":""}</span>`:""}</span></div>`).join("");
  document.querySelectorAll(".item").forEach(el=>{ el.onclick=()=>select(el.dataset.id); el.onkeydown=e=>{ if(e.key==="Enter") select(el.dataset.id); }; });
  if(open==="new"||(open&&apps.find(x=>x.id===open))) renderDetail(); else if(v.length){ open=v[0].id; mode="view"; renderDetail(); render(); } else $("#main").innerHTML=`<div class="detail"><div class="placeholder">Add an application to start.</div></div>`;
}
function select(id){ if(mode==="edit"&&open!==id&&!confirm("Discard unsaved edits?")) return; open=id; mode="view"; render(); }

function questionsHTML(a, prefix){
  const qs=a.questions||[];
  if(!qs.length) return `<p class="none">No prompts yet.</p>`;
  return `<div class="sec">Prompts <span class="line"></span></div>` + qs.map((q,i)=>`<div class="q">
    <h3>${esc(q.prompt)||"(untitled prompt)"}${q.tag?`<span class="tag">${esc(q.tag)}</span>`:""}</h3>
    ${q.note?`<p class="note">${esc(q.note)}</p>`:""}
    ${q.answer?`<div class="essay ${words(q.answer)>140?"clamp":""}" id="${prefix}e${i}">${esc(q.answer)}</div>
      <div class="qbar"><span>${words(q.answer)} words</span>${words(q.answer)>140?`<button data-toggle="${prefix}e${i}">Show all</button>`:""}<button data-copy="${a.id}:${i}">Copy</button></div>`:`<p class="none">No answer yet.</p>`}
  </div>`).join("");
}
function wireQuestions(root){
  root.querySelectorAll("[data-toggle]").forEach(b=>b.onclick=()=>{ const el=document.getElementById(b.dataset.toggle); el.classList.toggle("clamp"); b.textContent=el.classList.contains("clamp")?"Show all":"Show less"; });
  root.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>{ const [id,i]=b.dataset.copy.split(":"); const a=apps.find(x=>x.id===id); navigator.clipboard.writeText(a.questions[i].answer).then(()=>toast("Copied")); });
  root.querySelectorAll("select.status").forEach(s=>s.onchange=()=>setStatus(s.dataset.id,s.value));
}
function headHTML(a, actions){ return `<div class="d-head"><div style="flex:1;min-width:0"><h2>${esc(a.org)}</h2><p class="role">${[a.role,a.term,a.deadline?"due "+a.deadline:""].filter(Boolean).map(esc).join(" · ")}</p></div>${statusSelect(a)} ${actions}</div>`; }

function renderDetail(){
  const a = open==="new" ? {id:"new",org:"",role:"",term:"",deadline:"",status:"go",notes:[],questions:[]} : apps.find(x=>x.id===open);
  if(!a) return;
  if(mode==="view"){
    $("#main").innerHTML = `<div class="detail">${headHTML(a,`<button data-edit>Edit</button>`)}<div class="d-body">
      ${(a.notes||[]).length?`<dl>${a.notes.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>`:""}
      ${questionsHTML(a,"d")}</div></div>`;
    $("#main [data-edit]").onclick=()=>{mode="edit";renderDetail();};
    wireQuestions($("#main"));
  } else {
    $("#main").innerHTML = `<div class="detail"><div class="d-head"><h2>${a.id==="new"?"New application":"Edit "+esc(a.org)}</h2></div><div class="d-body"><div class="ed" data-editor="${a.id}">
      <div class="g2">
        <div><label>Organization</label><input name="org" value="${esc(a.org)}"></div>
        <div><label>Role</label><input name="role" value="${esc(a.role)}"></div>
        <div><label>When</label><input name="term" value="${esc(a.term)}" placeholder="Summer 2027"></div>
        <div><label>Deadline</label><input name="deadline" type="date" value="${esc(a.deadline||"")}"></div>
        <div><label>Status</label><select name="status">${Object.entries(STATUSES).map(([k,v])=>`<option value="${k}" ${a.status===k?"selected":""}>${v}</option>`).join("")}</select></div>
      </div>
      <label>Notes, one per line as "Label: text" (contact, platform, resume version, pay)</label>
      <textarea name="notes">${esc((a.notes||[]).map(([k,v])=>k+": "+v).join("\n"))}</textarea>
      <div class="qlist">${(a.questions||[]).map(qEditHTML).join("")}</div>
      <div class="foot"><button type="button" data-addq>Add prompt</button><span class="grow"></span>
        ${a.id!=="new"?`<button type="button" class="danger quiet" data-delete>Delete</button>`:""}
        <button type="button" data-cancel>Cancel</button><button type="button" class="primary" data-save>Save</button></div>
    </div></div></div>`;
    bindEditor(a);
    $("#main input[name=org]").focus();
  }
}
function renderDoc(v){
  $("#main").innerHTML = v.length ? v.map(a=>`<div class="docapp">${headHTML(a,`<button data-edit="${a.id}">Edit</button>`)}<div class="d-body">
    ${(a.notes||[]).length?`<dl>${a.notes.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>`:""}
    ${questionsHTML(a,a.id)}</div></div>`).join("") : `<div class="detail"><div class="placeholder">${apps.length?"Nothing matches.":"No applications yet."}</div></div>`;
  wireQuestions($("#main"));
  $("#main").querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{ view="split"; $("#v-split").setAttribute("aria-pressed","true"); $("#v-doc").setAttribute("aria-pressed","false"); open=b.dataset.edit; mode="edit"; render(); });
}
function qEditHTML(q){
  return `<div class="qe"><label>Prompt</label><input name="prompt" value="${esc(q.prompt)}">
    <div class="g2"><div><label>Tag (final, draft, submitted…)</label><input name="tag" value="${esc(q.tag||"")}"></div><div><label>Note to self</label><input name="qnote" value="${esc(q.note||"")}"></div></div>
    <label>Answer</label><textarea name="answer" class="long">${esc(q.answer||"")}</textarea>
    <div class="qrow"><span class="qbar">${words(q.answer)} words</span><button type="button" class="danger quiet" data-removeq>Remove prompt</button></div></div>`;
}
function bindEditor(a){
  const ed=$("#main .ed");
  const wire=()=>{ ed.querySelectorAll("[data-removeq]").forEach(b=>b.onclick=()=>b.closest(".qe").remove());
    ed.querySelectorAll('textarea[name="answer"]').forEach(t=>t.oninput=()=>t.closest(".qe").querySelector(".qbar").textContent=words(t.value)+" words"); };
  wire();
  ed.querySelector("[data-addq]").onclick=()=>{ ed.querySelector(".qlist").insertAdjacentHTML("beforeend",qEditHTML({prompt:"",tag:"",note:"",answer:""})); wire(); ed.querySelector(".qe:last-child input").focus(); };
  ed.querySelector("[data-cancel]").onclick=()=>{ mode="view"; if(a.id==="new") open=null; render(); };
  const del=ed.querySelector("[data-delete]"); if(del) del.onclick=async()=>{ if(!confirm("Delete this application and its essays?")) return;
    try{ await store.remove(a.id); apps=apps.filter(x=>x.id!==a.id); open=null; mode="view"; render(); toast("Deleted"); }catch(e){ toast(e.message); } };
  ed.querySelector("[data-save]").onclick=async()=>{
    const g=n=>ed.querySelector(`[name="${n}"]`).value.trim();
    const patch={ org:g("org"), role:g("role"), term:g("term"), deadline:g("deadline")||null, status:ed.querySelector('[name="status"]').value,
      notes:g("notes").split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{const i=l.indexOf(":");return i>0?[l.slice(0,i).trim(),l.slice(i+1).trim()]:["Note",l];}),
      questions:[...ed.querySelectorAll(".qe")].map(q=>({prompt:q.querySelector('[name="prompt"]').value.trim(),tag:q.querySelector('[name="tag"]').value.trim(),note:q.querySelector('[name="qnote"]').value.trim(),answer:q.querySelector('[name="answer"]').value.trim()})).filter(q=>q.prompt||q.answer) };
    if(!patch.org){ ed.querySelector('[name="org"]').focus(); return; }
    try{
      if(a.id==="new"){ patch.position = apps.length ? Math.min(...apps.map(x=>x.position||0))-1 : 0; const row=await store.insert(patch); if(!DEMO) apps.unshift(row); open=row.id; }
      else { const row=await store.update(a.id,patch); Object.assign(apps.find(x=>x.id===a.id),row); }
      mode="view"; render(); toast("Saved");
    }catch(e){ toast(e.message); }
  };
}
async function setStatus(id,status){ try{ const a=await store.update(id,{status}); Object.assign(apps.find(x=>x.id===id),a); render(); toast(STATUSES[status]); }catch(e){ toast(e.message); render(); } }

// ================= TOOLBAR =================
$("#btn-add").onclick=()=>{ view="split"; $("#v-split").setAttribute("aria-pressed","true"); $("#v-doc").setAttribute("aria-pressed","false"); open="new"; mode="edit"; render(); };
$("#search").oninput=e=>{query=e.target.value.trim();render();};
$("#sort").onchange=e=>{sort=e.target.value;render();};
$("#v-split").onclick=()=>{view="split";$("#v-split").setAttribute("aria-pressed","true");$("#v-doc").setAttribute("aria-pressed","false");render();};
$("#v-doc").onclick=()=>{view="doc";$("#v-doc").setAttribute("aria-pressed","true");$("#v-split").setAttribute("aria-pressed","false");render();};
$("#btn-export").onclick=()=>{ if(!apps.length) return; const blob=new Blob([JSON.stringify({exported:new Date().toISOString(),apps},null,2)],{type:"application/json"}); const u=URL.createObjectURL(blob); const l=Object.assign(document.createElement("a"),{href:u,download:"manifest.json"}); l.click(); URL.revokeObjectURL(u); };

$("#btn-import").onclick=()=>$("#file-import").click();
$("#file-import").onchange=async e=>{
  const f=e.target.files[0]; e.target.value=""; if(!f) return;
  let d; try{ d=JSON.parse(await f.text()); }catch{ toast("Not a valid JSON file"); return; }
  const list=Array.isArray(d)?d:(d.apps||[]);
  if(!list.length){ toast("No applications in that file"); return; }
  if(!confirm(`Import ${list.length} application${list.length>1?"s":""}? Existing ones are kept.`)) return;
  let n=0, base=apps.length?Math.min(...apps.map(x=>x.position||0)):0;
  for(const a of list){
    const row={ org:String(a.org||"").trim()||"Untitled", role:a.role||"", term:a.term||a.when||"", deadline:(a.deadline&&/^\d{4}-\d{2}-\d{2}$/.test(a.deadline))?a.deadline:null,
      status:STATUSES[a.status]?a.status:"go", position:--base,
      notes:Array.isArray(a.notes)?a.notes.map(x=>Array.isArray(x)?[String(x[0]),String(x[1]??"")]:["Note",String(x)]):[],
      questions:Array.isArray(a.questions)?a.questions.map(q=>({prompt:q.prompt||"",tag:q.tag||"",note:q.note||"",answer:q.answer||""})):[] };
    try{ const r=await store.insert(row); if(!DEMO) apps.push(r); n++; }catch(err){ toast(err.message); break; }
  }
  if(!DEMO){ try{ apps=await store.list(); }catch{} }
  render(); toast(`Imported ${n}`);
};


boot();
</script>
</body>
</html>
